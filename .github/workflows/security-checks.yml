name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_secret_scan.py
      - run: python scripts/check_secrets.py
  social-publishing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest Pillow arabic-reshaper python-bidi
      - run: python -m pytest tests/test_social_publish_plan.py tests/test_social_caption_guard.py tests/test_social_attachment.py tests/test_daily_social_reports.py tests/test_social_report_images.py -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test -- --runInBand src/lib/__tests__/security-routes.test.js src/lib/__tests__/supabase-server.test.ts src/lib/__tests__/admin-proxy-security.test.ts src/lib/__tests__/admin-auth-security.test.ts src/lib/__tests__/public-market-security.test.ts src/lib/__tests__/portfolio-performance-route.test.ts src/lib/__tests__/telegram-pro-route.test.ts src/lib/supabase/__tests__/viewer-context.test.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-only.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-public
          SUPABASE_SECRET_KEY: build-only-private
